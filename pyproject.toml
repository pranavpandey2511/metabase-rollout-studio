[project]
name = "metabase-rollout-studio"
version = "0.1.0"
description = "Local Gemini Computer Use evaluation workspace for Metabase"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "browserbase==1.4.0",
  "fastapi>=0.115,<1",
  "google-genai>=2.7.0",
  "playwright==1.55.0",
  "pydantic==2.12.0",
  "python-dotenv==1.0.1",
  "python-multipart>=0.0.12,<1",
  "rich",
  "termcolor==3.1.0",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest",
]

[tool.uv]
package = false
